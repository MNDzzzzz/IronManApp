# Habilitar soporte AndroidX (obligatorio para Jetpack Compose y Health Connect)
android.useAndroidX=true
android.nonTransitiveRClass=true

# Compatibilidad de SDK 35
android.suppressUnsupportedCompileSdk=35

# Optimización de memoria para compilación de Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
